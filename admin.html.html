<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>오더 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --ink:#16181D; --paper:#FFF; --wash:#F5F6F8; --line:#E4E6EA; --mute:#767D89;
  --accent:#1B3FD6; --warn:#C2410C; --ok:#0F7B4F;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--wash);color:var(--ink);font-size:14px;line-height:1.6;letter-spacing:-.01em}
button{font-family:var(--sans);cursor:pointer}
input,select,textarea{font-family:var(--sans);font-size:13.5px;color:var(--ink);border:1px solid var(--line);
  border-radius:5px;padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(27,63,214,.1)}
textarea{resize:vertical;min-height:62px}
.hide{display:none!important}

/* ---------- 잠금 화면 ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:34px 30px;width:min(360px,100%)}
.gate-card .brand{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--mute)}
.gate-card h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:10px 0 8px}
.gate-card p{font-size:13px;color:var(--mute);margin-bottom:20px}
.gate-card input{margin-bottom:12px}
.gate-err{display:none;font-size:12.5px;color:var(--warn);font-weight:600;margin-bottom:12px}
.gate-err.on{display:block}

/* ---------- 헤더 ---------- */
.bar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.bar-in{display:flex;align-items:center;gap:12px;padding:12px 20px;max-width:1600px;margin:0 auto}
.bar .title{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;font-weight:600}
.bar .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.sync{font-size:11.5px;color:var(--mute);font-family:var(--mono)}

/* ---------- 버튼 ---------- */
.b{border:1px solid var(--line);background:#fff;border-radius:5px;padding:7px 13px;font-size:12.5px;font-weight:600;transition:.12s}
.b:hover{border-color:#B9BEC7;background:var(--wash)}
.b.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.b.dark:hover{background:var(--accent);border-color:var(--accent)}
.b.red{color:var(--warn);border-color:#F3C7B2}
.b.red:hover{background:#FFF7F4}
.b:disabled{opacity:.45;cursor:not-allowed}
.b.wide{width:100%;padding:11px;font-size:13.5px}

/* ---------- 3단 ---------- */
.cols{display:grid;grid-template-columns:300px minmax(0,1fr) 440px;gap:14px;
  padding:14px 20px 40px;max-width:1600px;margin:0 auto;align-items:start}
@media(max-width:1280px){.cols{grid-template-columns:280px minmax(0,1fr)}
  .pane.sheet{grid-column:1/-1}}
@media(max-width:820px){.cols{grid-template-columns:1fr}.pane.sheet{grid-column:auto}}

.pane{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.pane-head{display:flex;align-items:center;gap:8px;padding:12px 15px;border-bottom:1px solid var(--line);background:var(--wash)}
.pane-head h2{font-size:13.5px;font-weight:700}
.pane-head .n{font-family:var(--mono);font-size:11px;color:var(--mute)}
.pane-head .r{margin-left:auto;display:flex;gap:6px}
.pane-head .b{padding:5px 9px;font-size:11.5px}

/* ---------- 목록 ---------- */
.list-body{max-height:calc(100vh - 190px);overflow:auto}
.card{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer;transition:.1s}
.card:hover{background:var(--wash)}
.card.sel{background:#F5F7FF;box-shadow:inset 3px 0 0 var(--accent)}
.card input{width:15px;height:15px;accent-color:var(--accent);margin-top:3px;cursor:pointer}
.card .t{font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:.05em}
.card .nm{font-weight:700;font-size:13.5px;margin:2px 0 3px;word-break:keep-all}
.card .mt{font-size:11.5px;color:var(--mute);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;background:var(--wash);border:1px solid var(--line)}
.tag.접수{color:var(--accent);border-color:#C3CEF7;background:#F2F5FE}
.tag.진행{color:#8A5A00;border-color:#F0DCA8;background:#FDF8EC}
.tag.완료{color:var(--ok);border-color:#B4DCC8;background:#F0FAF5}
.tag.보류{color:var(--mute)}
.empty{padding:44px 20px;text-align:center;color:var(--mute);font-size:13px}

/* ---------- 편집 ---------- */
.edit-body{padding:16px;max-height:calc(100vh - 190px);overflow:auto}
.fs{border:0;margin-bottom:18px}
.fs legend{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--accent);margin-bottom:9px}
.row{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}
.row.one{grid-template-columns:1fr}
.fl{display:flex;flex-direction:column;gap:5px}
.fl label{font-size:11.5px;font-weight:600;color:#3B4048}
.qty-note{font-family:var(--mono);font-size:12px;color:var(--mute);margin-top:8px}
.qty-note b{color:var(--ink);font-size:15px}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.imgs a{width:64px;height:64px;border-radius:5px;overflow:hidden;border:1px solid var(--line);display:block}
.imgs img{width:100%;height:100%;object-fit:cover}
.save-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;margin:0 -16px -16px}
.hint{padding:60px 20px;text-align:center;color:var(--mute);font-size:13px;line-height:1.9}

/* ---------- 작업지시서 (A4) ---------- */
.wo-wrap{padding:14px;background:#EDEFF2;overflow:auto}
.wo{width:794px;min-height:1123px;background:#fff;padding:46px 44px;transform-origin:top left;
  font-size:11px;line-height:1.55;color:#111}
.wo-top{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:12px}
.wo-top h3{font-size:25px;font-weight:800;letter-spacing:.14em}
.wo-top .co{text-align:right;font-family:var(--mono);font-size:10px;line-height:1.7;color:#444}
.wo-meta{display:flex;gap:24px;font-family:var(--mono);font-size:10px;color:#444;padding:9px 0;border-bottom:1px solid #DDD}
table.wo-t{width:100%;border-collapse:collapse;margin-top:16px}
table.wo-t th,table.wo-t td{border:1px solid #C9CDD3;padding:7px 9px;vertical-align:top;text-align:left}
table.wo-t th{background:#F2F4F6;font-weight:700;width:96px;font-size:10.5px;white-space:nowrap}
table.wo-t td{font-size:11px;word-break:break-word;white-space:pre-wrap}
.wo-cap{font-size:10.5px;font-weight:800;letter-spacing:.1em;margin:20px 0 -6px;color:#111}
.wo-big{font-family:var(--mono);font-size:20px;font-weight:600}
.wo-imgs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.wo-imgs div{aspect-ratio:3/4;border:1px solid #C9CDD3;overflow:hidden;background:#F2F4F6}
.wo-imgs img{width:100%;height:100%;object-fit:cover}
.wo-sign{margin-top:26px;display:flex;gap:9px;justify-content:flex-end}
.wo-sign span{border:1px solid #C9CDD3;width:96px;height:52px;font-size:9px;color:#888;padding:4px 6px}
.dl-bar{padding:12px 15px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;background:#fff}
.dl-bar label{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:5px;cursor:pointer}
.dl-bar input{width:15px;height:15px;accent-color:var(--accent)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:var(--ink);
  color:#fff;padding:11px 20px;border-radius:6px;font-size:13px;font-weight:600;opacity:0;
  transition:.22s;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- 잠금 -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="brand" id="gBrand">Y&amp;J COMPANY</div>
    <h1>오더 관리</h1>
    <p>내부 전용 페이지입니다. 접근키를 입력해주세요.</p>
    <input type="password" id="keyInput" placeholder="접근키" autocomplete="off">
    <div class="gate-err" id="gateErr">접근키가 올바르지 않습니다.</div>
    <button class="b dark wide" id="openBtn">열기</button>
  </div>
</div>

<!-- 본체 -->
<div id="app" class="hide">
  <div class="bar"><div class="bar-in">
    <span class="title" id="hBrand">Y&amp;J COMPANY</span>
    <span style="font-size:13px;font-weight:700">오더 관리</span>
    <span class="sp">
      <span class="sync" id="sync"></span>
      <button class="b" id="reloadBtn">새로고침</button>
      <button class="b" id="lockBtn">잠금</button>
    </span>
  </div></div>

  <div class="cols">
    <!-- 목록 -->
    <section class="pane">
      <div class="pane-head">
        <h2>접수 목록</h2><span class="n" id="cnt">0</span>
        <span class="r">
          <button class="b" id="allBtn">선택</button>
          <button class="b" id="noneBtn">해제</button>
          <button class="b red" id="delBtn">삭제</button>
        </span>
      </div>
      <div class="list-body" id="listBody"><div class="empty">불러오는 중…</div></div>
    </section>

    <!-- 편집 -->
    <section class="pane">
      <div class="pane-head"><h2>오더 편집</h2><span class="n" id="editTicket"></span></div>
      <div class="edit-body" id="editBody">
        <div class="hint">왼쪽에서 선택하세요<br><span style="font-size:12px">접수 건을 선택하면<br>작업지시서 항목을 바로 고칠 수 있습니다.</span></div>
      </div>
    </section>

    <!-- 작업지시서 -->
    <section class="pane sheet">
      <div class="pane-head"><h2>작업 지시서</h2><span class="n">A4 · 인쇄 가능</span></div>
      <div class="wo-wrap" id="woWrap">
        <div class="wo" id="wo"><div style="padding:60px 0;text-align:center;color:#999">왼쪽에서 선택하세요</div></div>
      </div>
      <div class="dl-bar">
        <button class="b dark" id="pngBtn" disabled>작업지시서 다운로드 (PNG)</button>
        <label><input type="checkbox" id="hiRes" checked> 2배 고해상도</label>
      </div>
    </section>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== 설정 =========================================== */
const BRAND    = 'Y&J COMPANY';
const ENDPOINT = 'https://script.google.com/macros/s/AKfycby0SvtyGc5ZzKfi8WgEe1aao7vJAB6DTdortEh3NQfMByRt-UXQtahZ7ZbgLsM4GLyg/exec';
/* ====================================================== */

const $ = id => document.getElementById(id);
$('gBrand').textContent = $('hBrand').textContent = BRAND;

let KEY = sessionStorage.getItem('ok') || '';
let rows = [], cur = null, checked = new Set();

const nf = n => (+n || 0).toLocaleString('ko-KR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2200); }

/* ---- 통신 ---- */
function jsonp(params){
  return new Promise((res, rej) => {
    const cb = 'cb' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); rej(new Error('시간 초과')); }, 20000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); res(d); };
    s.onerror = () => { cleanup(); rej(new Error('연결 실패')); };
    s.src = ENDPOINT + '?' + new URLSearchParams({ ...params, callback: cb });
    document.head.appendChild(s);
  });
}
async function post(body){
  const r = await fetch(ENDPOINT, { method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) });
  return r.json().catch(() => ({ ok:true }));
}

/* ---- 잠금 ---- */
$('openBtn').addEventListener('click', unlock);
$('keyInput').addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });
async function unlock(){
  const k = $('keyInput').value.trim();
  if(!k) return;
  $('openBtn').disabled = true; $('openBtn').textContent = '확인 중…';
  try{
    const d = await jsonp({ action:'list', key:k });
    if(!d.ok){ $('gateErr').classList.add('on'); return; }
    KEY = k; sessionStorage.setItem('ok', k);
    $('gate').classList.add('hide'); $('app').classList.remove('hide');
    render(d.rows);
  }catch(err){ $('gateErr').textContent = '연결 실패: ' + err.message; $('gateErr').classList.add('on'); }
  finally{ $('openBtn').disabled = false; $('openBtn').textContent = '열기'; }
}
$('lockBtn').addEventListener('click', () => { sessionStorage.removeItem('ok'); location.reload(); });
$('reloadBtn').addEventListener('click', load);

async function load(){
  $('sync').textContent = '불러오는 중…';
  try{
    const d = await jsonp({ action:'list', key:KEY });
    if(d.ok) render(d.rows); else toast('접근키 오류');
  }catch(err){ toast('불러오기 실패'); }
}

/* ---- 목록 ---- */
function render(list){
  rows = list || [];
  $('cnt').textContent = rows.length + '건';
  $('sync').textContent = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) + ' 기준';
  $('listBody').innerHTML = rows.length ? rows.map(r => `
    <div class="card${cur && cur.ticket===r.ticket ? ' sel':''}" data-t="${esc(r.ticket)}">
      <input type="checkbox" data-c="${esc(r.ticket)}" ${checked.has(r.ticket)?'checked':''}>
      <div>
        <div class="t">${esc(r.ticket)}</div>
        <div class="nm">${esc(r.brand)}</div>
        <div class="mt">
          <span class="tag ${esc(r.status||'접수')}">${esc(r.status||'접수')}</span>
          <span>${esc(r.items)}</span><span>·</span><span>${nf(r.total)}장</span>
          ${r.dueDate ? '<span>·</span><span>~'+esc(r.dueDate)+'</span>' : ''}
        </div>
      </div>
    </div>`).join('') : '<div class="empty">접수된 건이 없습니다.</div>';
}
$('listBody').addEventListener('click', e => {
  const cb = e.target.closest('input[data-c]');
  if(cb){ cb.checked ? checked.add(cb.dataset.c) : checked.delete(cb.dataset.c); e.stopPropagation(); return; }
  const card = e.target.closest('.card'); if(!card) return;
  select(rows.find(r => r.ticket === card.dataset.t));
});
$('allBtn').addEventListener('click', ()=>{ rows.forEach(r=>checked.add(r.ticket)); render(rows); });
$('noneBtn').addEventListener('click', ()=>{ checked.clear(); render(rows); });
$('delBtn').addEventListener('click', async ()=>{
  if(!checked.size) return toast('삭제할 건을 체크하세요');
  if(!confirm(checked.size + '건을 삭제합니다. 되돌릴 수 없습니다.')) return;
  await post({ action:'delete', key:KEY, tickets:[...checked] });
  checked.clear(); cur = null; $('editTicket').textContent=''; toast('삭제했습니다'); load();
});

/* ---- 편집 폼 ---- */
const FIELDS = [
  ['발주처', [['brand','브랜드·회사명'],['person','담당자'],['phone','연락처'],['address','주소']]],
  ['오더', [['items','품목'],['status','상태','sel','접수|진행|완료|보류'],
            ['dueDate','납기일','date'],['targetPrice','희망단가']]],
  ['수량', [['styles','스타일 수','num'],['colors','컬러 수','num'],
            ['sizes','사이즈 수','num'],['perUnit','컬러·사이즈당','num']]],
  ['작업지시', [['material','주원자재·부자재','area'],['detail','디테일','area'],
            ['spec','사이즈 스펙','area'],['sewing','부위별 봉제·가공','area'],
            ['packing','포장 명세','area'],['qc','QC 기준','area']]],
  ['기타', [['inspect','검사 방식'],['fabric','원단 확정','sel','|확정|미확정|공장 소싱 요청'],
            ['assets','보유 자료'],['channel','판매 채널','area'],['etc','전달사항','area']]]
];

function select(r){
  if(!r) return;
  cur = { ...r };
  $('editTicket').textContent = r.ticket;
  $('pngBtn').disabled = false;

  const input = ([k,l,t,opt]) => {
    const v = esc(cur[k]);
    let el;
    if(t==='area')      el = `<textarea data-k="${k}">${v}</textarea>`;
    else if(t==='sel')  el = `<select data-k="${k}">${opt.split('|').map(o=>`<option${o===cur[k]?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(t==='date') el = `<input type="date" data-k="${k}" value="${v}">`;
    else if(t==='num')  el = `<input type="number" min="1" data-k="${k}" value="${v}">`;
    else                el = `<input type="text" data-k="${k}" value="${v}">`;
    return `<div class="fl"${t==='area'?' style="grid-column:1/-1"':''}><label>${l}</label>${el}</div>`;
  };

  const imgs = (cur.images||'').split('\n').filter(Boolean);
  $('editBody').innerHTML = FIELDS.map(([leg, fs]) =>
      `<fieldset class="fs"><legend>${leg}</legend><div class="row">${fs.map(input).join('')}</div>
       ${leg==='수량' ? '<div class="qty-note" id="qn"></div>' : ''}</fieldset>`).join('')
    + (imgs.length ? `<fieldset class="fs"><legend>첨부 이미지</legend><div class="imgs">${
        imgs.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt=""></a>`).join('')}</div></fieldset>` : '')
    + `<div class="save-bar"><button class="b dark wide" id="saveBtn">변경사항 저장</button></div>`;

  $('editBody').addEventListener('input', onEdit);
  $('editBody').addEventListener('change', onEdit);
  $('saveBtn').addEventListener('click', save);
  recalc(); paint(); render(rows);
}

function onEdit(e){
  const el = e.target.closest('[data-k]'); if(!el) return;
  cur[el.dataset.k] = el.value;
  recalc(); paint();
}
function recalc(){
  const n = k => Math.max(1, parseInt(cur[k],10) || 1);
  cur.total = n('styles') * n('colors') * n('sizes') * (parseInt(cur.perUnit,10) || 0);
  const qn = $('qn');
  if(qn) qn.innerHTML = `총 발주 수량 <b>${nf(cur.total)}</b>장 &nbsp;<span style="opacity:.6">${n('styles')} × ${n('colors')} × ${n('sizes')} × ${parseInt(cur.perUnit,10)||0}</span>`;
}

async function save(){
  const btn = $('saveBtn'); btn.disabled = true; btn.textContent = '저장 중…';
  const fields = {}; 
  ['brand','person','phone','address','items','status','dueDate','targetPrice',
   'styles','colors','sizes','perUnit','total','material','detail','spec','sewing',
   'packing','qc','inspect','fabric','assets','channel','etc'].forEach(k => fields[k] = cur[k] ?? '');
  try{
    await post({ action:'update', key:KEY, ticket:cur.ticket, fields });
    const i = rows.findIndex(r=>r.ticket===cur.ticket); if(i>-1) rows[i] = {...cur};
    render(rows); toast('저장했습니다');
  }catch(err){ toast('저장 실패'); }
  btn.disabled = false; btn.textContent = '변경사항 저장';
}

/* ---- 작업지시서 ---- */
function paint(){
  const v = k => esc(cur[k] || '') || '-';
  const imgs = (cur.images||'').split('\n').filter(Boolean).slice(0,4);
  const tr = (l,c) => `<tr><th>${l}</th><td>${c}</td></tr>`;
  $('wo').innerHTML = `
    <div class="wo-top">
      <h3>작업지시서</h3>
      <div class="co">${esc(BRAND)}<br>${esc(cur.ticket)}</div>
    </div>
    <div class="wo-meta">
      <span>접수 ${v('createdAt')}</span><span>출력 ${new Date().toLocaleDateString('ko-KR')}</span>
      <span>상태 ${v('status')}</span>
    </div>
    <table class="wo-t">
      ${tr('발주처', v('brand'))}${tr('담당자', v('person') + ' / ' + v('phone'))}
      ${tr('주소', v('address'))}${tr('품목', v('items'))}
    </table>
    <div class="wo-cap">수량 · 납기</div>
    <table class="wo-t">
      ${tr('총 수량', `<span class="wo-big">${nf(cur.total)}</span> 장 &nbsp; <span style="color:#666">${
        (cur.styles||1)} 스타일 × ${(cur.colors||1)} 컬러 × ${(cur.sizes||1)} 사이즈 × ${(cur.perUnit||0)} 장</span>`)}
      ${tr('납기일', v('dueDate'))}${tr('단가', v('targetPrice'))}
    </table>
    <div class="wo-cap">작업 지시</div>
    <table class="wo-t">
      ${tr('주원자재<br>부자재', v('material'))}${tr('디테일', v('detail'))}
      ${tr('사이즈 스펙', v('spec'))}${tr('봉제·가공', v('sewing'))}
      ${tr('포장', v('packing'))}${tr('QC 기준', v('qc'))}
      ${tr('검사 방식', v('inspect'))}${tr('원단', v('fabric') + ' / 자료 ' + v('assets'))}
      ${tr('전달사항', v('etc'))}
    </table>
    ${imgs.length ? `<div class="wo-cap">참고 이미지</div><div class="wo-imgs">${
      imgs.map(u=>`<div><img src="${esc(u)}" crossorigin="anonymous" alt=""></div>`).join('')}</div>` : ''}
    <div class="wo-sign"><span>발주 확인</span><span>생산 확인</span><span>검사 확인</span></div>`;
  fit();
}
function fit(){
  const w = $('woWrap').clientWidth - 28;
  const s = Math.min(1, w / 794);
  const wo = $('wo');
  wo.style.transform = `scale(${s})`;
  $('woWrap').style.height = (1123 * s + 28) + 'px';
}
window.addEventListener('resize', () => { if(cur) fit(); });

$('pngBtn').addEventListener('click', async () => {
  const btn = $('pngBtn'); btn.disabled = true; btn.textContent = '만드는 중…';
  const wo = $('wo'), keep = wo.style.transform;
  wo.style.transform = 'scale(1)';
  try{
    const cv = await html2canvas(wo, {
      scale: $('hiRes').checked ? 2 : 1, backgroundColor:'#fff', useCORS:true, logging:false });
    const a = document.createElement('a');
    a.download = `작업지시서_${cur.ticket}_${cur.brand}.png`;
    a.href = cv.toDataURL('image/png'); a.click();
  }catch(err){ toast('이미지 생성 실패'); }
  wo.style.transform = keep;
  btn.disabled = false; btn.textContent = '작업지시서 다운로드 (PNG)';
});

/* 세션 복구 */
if(KEY){ $('keyInput').value = KEY; unlock(); }
</script>
</body>
</html>
